# Environment for Copilot cloud agent and Copilot code review.
#
# Copilot code review runs on a runner from this repository, falling back to
# this file when there is no `copilot-code-review.yml`. Without either, the
# review on #37 reported "Copilot couldn't run its full agentic review because
# it didn't start before the timeout", so only the non-agentic fallback ran and
# `.github/skills/code-review/SKILL.md` was never consulted.
#
# The job MUST be named `copilot-setup-steps`; only `steps`, `permissions`,
# `runs-on`, `services`, `snapshot` and `timeout-minutes` are honoured.
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --group dev --locked

      - name: Install pre-commit hooks
        run: uv run pre-commit install
