# Environment for Copilot code review.
#
# Copilot code review runs on a runner from this repository. Without this file
# it falls back to `copilot-setup-steps.yml`, and without either it could not
# get a runner in time — the review on #37 reported "Copilot couldn't run its
# full agentic review because it didn't start before the timeout", so only the
# non-agentic fallback ran and `.github/skills/code-review/SKILL.md` was never
# consulted.
#
# The job MUST be named `copilot-setup-steps`; only `steps`, `permissions`,
# `runs-on`, `services`, `snapshot` and `timeout-minutes` are honoured. The
# steps mirror the `format` job in ci.yml so a review can run `uv run pytest`
# or `uv run nox -s mypy` against the same environment CI uses.
name: Copilot Code Review

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-code-review.yml
  pull_request:
    paths:
      - .github/workflows/copilot-code-review.yml

jobs:
  copilot-setup-steps:
    name: Set up Copilot code review environment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867 # v7.1.6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the project
        run: uv sync --no-default-groups --group test --locked
